name: Deploy to InfinityFree

on:
  push:
    branches: [ main ]

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          # Si este dominio NO es el dominio principal de la cuenta de
          # InfinityFree, cambia esto a /htdocs/tudominio.com/ (revísalo
          # en el Panel de Control -> Online File Manager para confirmar
          # la ruta real).
          server-dir: /htdocs/
          exclude: |
            **/.git*
            **/.github/**
            **/.idea/**
            includes/config.php
